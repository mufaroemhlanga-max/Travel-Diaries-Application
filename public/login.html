<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login  - My Travel Diaries</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Login</h1>

    <!-- Login form: JS (login.js) intercepts submit and sends data via fetch instead of a normal page reload -->
    <form id="loginForm">
        <input type="email" id="email" placeholder="email" required>
        <input type="password" id="password" placeholder="password" required>
        <button type="submit">Login</button>
    </form>

    <!-- Filled in by JS with a success or error message after the form is submitted -->
    <p id="loginMessage"></p>
    <script src="js/login.js"></script>
</body>
</html>
